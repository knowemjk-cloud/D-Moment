<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لحظتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101112; --panel:#18191b; --card:#212325; --ink:#efece3; --muted:#8d9092;
  --accent1:#d4af37; --accent2:#12a668; --line:#c7c9cc22;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{ --bg:#f4f3ef; --panel:#ffffff; --card:#ece9df; --ink:#1c1b18; --muted:#5c5f61; --line:#00000014; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{background:var(--bg); color:var(--ink); font-family:'Cairo',Tahoma,sans-serif; overflow:hidden;}
button,input,textarea,select{font-family:inherit;}
.hidden{display:none !important;}
.grad{background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff;}
.gradText{background:linear-gradient(135deg,var(--accent1),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.screen{position:fixed; inset:0; display:flex; flex-direction:column;}
.center{align-items:center; justify-content:center; text-align:center; gap:14px; padding:20px;}
.btn{border:none; border-radius:12px; padding:12px 18px; font-weight:800; font-size:14px;}
.btn.ghost{background:var(--card); color:var(--ink);}
.field{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px; margin-bottom:8px;}
.icon{font-size:20px;}
a{color:inherit;}

/* splash / auth */
#splash h1{font-size:34px; margin:0; font-weight:800;}
.card{width:100%; max-width:360px; background:var(--panel); border-radius:16px; padding:16px;}
.tabs{display:flex; gap:6px; background:var(--card); border-radius:12px; padding:4px; margin-bottom:12px;}
.tabs button{flex:1; background:none; border:none; padding:10px; border-radius:9px; font-weight:700; color:var(--muted);}
.tabs button.active{background:var(--panel); color:var(--ink);}

/* app shell */
#app{position:fixed; inset:0; display:none; flex-direction:column;}
#topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--panel); border-bottom:1px solid var(--line); z-index:5;}
#topbar .logo{font-weight:800; font-size:18px;}
#views{flex:1; position:relative; overflow:hidden;}
.view{position:absolute; inset:0; overflow-y:auto; display:none;}
.view.active{display:block;}

/* stories */
#storiesRow{display:flex; gap:12px; padding:12px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--line);}
.story{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:60px;}
.storyRing{width:56px; height:56px; border-radius:50%; padding:2px; display:flex; align-items:center; justify-content:center; font-size:20px;}
.storyRing span{display:block;}
.storyLabel{font-size:11px; color:var(--muted); max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* feed */
#feed{height:100%; overflow-y:scroll; scroll-snap-type:y mandatory;}
.vcard{height:100%; scroll-snap-align:start; position:relative; display:flex; align-items:flex-end; color:#fff; overflow:hidden; background:#000;}
.vmedia{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.vscrim{position:absolute; inset:0; background:linear-gradient(transparent 40%,#000b);}
.vinfo{position:relative; z-index:2; padding:16px; padding-bottom:90px; max-width:75%;}
.vinfo b{font-size:15px;} .vinfo p{margin:6px 0; font-size:13px; opacity:.9;}
.vactions{position:absolute; z-index:2; left:10px; bottom:100px; display:flex; flex-direction:column; align-items:center; gap:18px;}
.vactions .a{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px;}
.vactions .a .icon{background:#0006; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px;}
.avatarSm{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; margin-bottom:8px; overflow:hidden;}
.emptyState{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; text-align:center; padding:30px; color:var(--muted);}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* grid */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px;}
.tile{aspect-ratio:9/13; position:relative; overflow:hidden; background:var(--card);}
.tile img,.tile video{width:100%; height:100%; object-fit:cover;}
.tile span{position:absolute; bottom:6px; right:6px; font-size:11px; color:#fff; text-shadow:0 1px 3px #000;}

/* bottom nav */
#bottomNav{display:flex; justify-content:space-around; align-items:center; background:var(--panel); border-top:1px solid var(--line); padding:8px 0; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
.navBtn{background:none; border:none; color:var(--muted); font-size:22px; display:flex; flex-direction:column; align-items:center; gap:2px;}
.navBtn.active{color:var(--ink);}
.navBtn small{font-size:10px;}
#createBtn{width:44px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff;}

/* overlays / sheets */
.overlay{position:fixed; inset:0; background:#000a; display:flex; align-items:flex-end; z-index:40;}
.overlay.center{align-items:center; justify-content:center;}
.sheet{background:var(--panel); width:100%; max-height:75%; border-radius:18px 18px 0 0; padding:14px; overflow-y:auto;}
.sheetHandle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 10px;}
.commentRow{display:flex; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
#commentInput{display:flex; gap:8px; padding-top:8px;}
#commentInput input{flex:1;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#000c; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:60;}
.switchRow{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
.toggle{width:42px; height:24px; border-radius:12px; background:var(--card); position:relative; border:1px solid var(--line);}
.toggle.on{background:var(--accent1);}
.toggle i{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s;}
.toggle.on i{right:auto; left:2px;}
.editRow{display:flex; gap:14px; overflow-x:auto; padding:10px 0;}
.editIcon{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; min-width:50px; color:var(--muted);}
.editIcon .icon{background:var(--card); width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px;}
.storyView{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; color:#fff;}
.storyProg{display:flex; gap:4px; padding:8px;}
.storyProg div{flex:1; height:3px; background:#fff5; border-radius:2px; overflow:hidden;}
.storyProg div i{display:block; height:100%; background:#fff; width:0%;}
</style>
<style>
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.muted{color:var(--muted);font-size:12px}
.xbtn{background:none;border:none;color:inherit;font-size:20px;cursor:pointer}
.fileIn{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.fbtn{margin-inline-start:8px;background:var(--accent1);color:#111;border:none;border-radius:8px;padding:3px 10px;font-weight:800;font-size:12px}
.tag,.mention{color:var(--accent1);font-weight:700;cursor:pointer}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent1);border-radius:50%;animation:spin .8s linear infinite}
#viewHome.active{display:flex;flex-direction:column;overflow:hidden}
#viewHome #feed{flex:1;min-height:0;height:auto}
#ptr{position:absolute;top:70px;left:50%;transform:translateX(-50%);opacity:0;z-index:6;font-size:24px;color:var(--accent1);pointer-events:none}
.storyRing.unseen{background:linear-gradient(135deg,var(--accent1),var(--accent2))}
.storyRing.seen{background:var(--line)}
.storyRing.addRing{background:var(--card);border:1px dashed var(--muted);color:var(--accent1);font-size:24px}
.storyRing .av{border:2px solid var(--panel)}
.storyView .shead{display:flex;align-items:center;gap:8px;padding:0 12px}
.storyView .shead .xbtn{margin-inline-start:auto;color:#fff}
.postView,.pageView{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.postView .floatClose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;color:#fff;background:#0007;border-radius:50%;width:38px;height:38px}
.pageHead{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.pageBody{flex:1;overflow-y:auto}
.chip{display:inline-block;background:var(--card);border-radius:20px;padding:4px 12px;font-size:12px;margin:3px}
.chip.dim{color:var(--muted)}
.statsRow{display:flex;justify-content:center;gap:26px;margin:12px 0}
.statsRow div{cursor:pointer;text-align:center}
.badge{position:absolute;top:-4px;right:-6px;background:#e5484d;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:800}
.navBtn{position:relative}
.sect{margin:12px 0 4px;font-size:13px}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow .grow{flex:1;cursor:pointer}
.pbtn{background:var(--card);color:var(--ink);border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px}
.pbtn.on{background:var(--accent1);color:#111}
.bar{height:6px;background:var(--card);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent1),var(--accent2))}
.unread{background:#d4af3714}
.tile video{pointer-events:none}
</style>
</head>
<body>

<div id="splash" class="screen center grad"><h1>لحظتك</h1><p>لحظاتك القصيرة، بأسلوبك.</p></div>

<div id="auth" class="screen center hidden">
  <h1 class="gradText" style="font-size:26px;margin:0">لحظتك</h1>
  <div class="card" style="max-height:88vh;overflow-y:auto">
    <div class="tabs"><button id="tabLogin" class="active">دخول</button><button id="tabSignup">حساب جديد</button></div>
    <div id="loginForm">
      <input class="field" id="liId" placeholder="البريد الإلكتروني أو اسم المستخدم" autocomplete="username">
      <input class="field" id="liPw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
      <button class="btn grad" style="width:100%" id="loginBtn">دخول</button>
    </div>
    <div id="signupForm" class="hidden">
      <input class="field" id="suUser" placeholder="اسم المستخدم (إنجليزي)" autocomplete="username" maxlength="20">
      <input class="field" id="suEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
      <input class="field" id="suPw" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="new-password">
      <label class="muted">تاريخ الميلاد</label>
      <input class="field" id="suDob" type="date">
      <p class="muted" style="margin:0 0 8px">العمر الأدنى 13 سنة. حسابات من هم دون 18 تكون خاصة تلقائيًا ومحمية.</p>
      <button class="btn grad" style="width:100%" id="signupBtn">إنشاء الحساب</button>
    </div>
    <div id="gsForm" class="hidden">
      <b>أكمل حسابك</b>
      <input class="field" id="gsUser" placeholder="اسم المستخدم" maxlength="20" style="margin-top:8px">
      <label class="muted">تاريخ الميلاد</label>
      <input class="field" id="gsDob" type="date">
      <button class="btn grad" style="width:100%" id="gsBtn">متابعة</button>
    </div>
    <div id="googleWrap">
      <div style="text-align:center;font-size:11px;color:var(--muted);margin:10px 0">أو</div>
      <div id="googleBtnBox" style="display:flex;justify-content:center"></div>
      <p id="googleNote" class="muted hidden" style="text-align:center">تسجيل Google غير مفعّل على هذا الخادم بعد.</p>
    </div>
    <p id="authErr" style="color:#ff6b6b;font-size:12px;min-height:16px;margin:8px 0 0"></p>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <span class="logo gradText">لحظتك</span>
    <button class="navBtn" style="padding:0" data-act="random" aria-label="لحظتي العشوائية"><span class="icon">🎲</span></button>
  </div>
  <div id="views">
    <div id="viewHome" class="view active"><div id="storiesRow"></div><div id="feed"></div><div id="ptr">⟳</div></div>
    <div id="viewSearch" class="view">
      <div style="padding:10px"><input class="field" id="sq" placeholder="ابحث عن أشخاص، فيديوهات، هاشتاغات..."></div>
      <div class="tabs" style="margin:0 10px 10px">
        <button class="stab active" data-t="users">أشخاص</button><button class="stab" data-t="videos">فيديوهات</button><button class="stab" data-t="hashtags">هاشتاغات</button>
      </div>
      <div id="sres" style="padding:0 10px"></div>
    </div>
    <div id="viewNotif" class="view"><div id="nlist" style="padding:10px"></div></div>
    <div id="viewProfile" class="view"></div>
  </div>
  <div id="bottomNav">
    <button class="navBtn active" data-v="home"><span class="icon">🏠</span><small>الرئيسية</small></button>
    <button class="navBtn" data-v="search"><span class="icon">🔎</span><small>استكشاف</small></button>
    <button id="createBtn" class="grad" data-act="create">＋</button>
    <button class="navBtn" data-v="notif"><span class="icon">🔔</span><small>الإشعارات</small><span class="badge hidden" id="nbadge"></span></button>
    <button class="navBtn" data-v="profile"><span class="icon">👤</span><small>ملفي</small></button>
  </div>
</div>

<div id="overlays"></div>
<input type="file" id="capV" class="fileIn" accept="video/*" capture="environment">
<input type="file" id="capP" class="fileIn" accept="image/*" capture="environment">
<input type="file" id="galleryInput" class="fileIn" accept="image/*,video/*">
<input type="file" id="storyInput" class="fileIn" accept="image/*,video/*">
<input type="file" id="avatarInput" class="fileIn" accept="image/*">

<script>
'use strict';
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REASONS={inappropriate:'محتوى غير مناسب',harassment:'تنمر أو مضايقة',impersonation:'انتحال شخصية',fraud:'احتيال أو خداع',copyright:'انتهاك حقوق الملكية',minor_safety:'أمان القاصرين',spam:'محتوى مزعج (Spam)',other:'سبب آخر'};
const NTXT={follow:'بدأ بمتابعتك',follow_request:'طلب متابعتك',follow_accepted:'قبل طلب متابعتك',like:'أعجب بمنشورك',comment:'علّق على منشورك',mention:'ذكرك في تعليق'};
let token=localStorage.getItem('lz_token'), me=null, muted=true, cfg={}, googleCred=null;
const POSTS=new Map();
if(localStorage.getItem('lz_theme')) document.documentElement.dataset.theme=localStorage.getItem('lz_theme');

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function overlay(html,center){const o=document.createElement('div');o.className='overlay'+(center?' center':'');o.innerHTML=html;$('#overlays').appendChild(o);o.addEventListener('click',e=>{if(e.target===o)o.remove();});return o;}
const closeOverlays=()=>{$('#overlays').innerHTML='';};
const spin='<div class="emptyState" style="height:auto;padding:30px"><div class="spinner"></div></div>';
const avatarHtml=(u,size)=>u.avatar_url
  ?`<img class="av" src="${esc(u.avatar_url)}" alt="" style="width:${size}px;height:${size}px">`
  :`<div class="av grad" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px">${esc(((u.display_name||u.username||'?')+'?')[0])}</div>`;
const ago=s=>{const m=Math.max(0,Math.round((Date.now()-new Date(s.replace(' ','T')+'Z'))/6e4));return m<1?'الآن':m<60?`منذ ${m} د`:m<1440?`منذ ${Math.round(m/60)} س`:`منذ ${Math.round(m/1440)} يوم`;};
const rich=t=>esc(t).replace(/#([\p{L}\p{N}_]+)/gu,'<span class="tag" data-act="tag" data-tag="$1">#$1</span>').replace(/@([A-Za-z0-9_.]{3,20})/g,'<span class="mention" data-act="user" data-u="$1">@$1</span>');

async function api(path,opt={}){
  const h={};if(token)h.Authorization='Bearer '+token;
  let body;if(opt.form)body=opt.form;else if(opt.body){h['Content-Type']='application/json';body=JSON.stringify(opt.body);}
  let r;try{r=await fetch('/api'+path,{method:opt.method||'GET',headers:h,body});}catch(e){throw new Error('تعذّر الاتصال بالخادم');}
  let d=null;try{d=await r.json();}catch(e){}
  if(r.status===401&&token)logoutLocal();
  if(!r.ok)throw new Error((d&&d.error)||'حدث خطأ');
  return d;
}
function logoutLocal(){
  token=null;me=null;localStorage.removeItem('lz_token');closeOverlays();
  $('#app').style.display='none';$('#auth').classList.remove('hidden');
}

/* ---------------- auth ---------------- */
const authErr=m=>{$('#authErr').textContent=m||'';};
function setTab(login){
  $('#tabLogin').classList.toggle('active',login);$('#tabSignup').classList.toggle('active',!login);
  $('#loginForm').classList.toggle('hidden',!login);$('#signupForm').classList.toggle('hidden',login);
  $('#gsForm').classList.add('hidden');authErr('');
}
$('#tabLogin').onclick=()=>setTab(true);$('#tabSignup').onclick=()=>setTab(false);
async function submitAuth(btn,path,body){
  authErr('');btn.disabled=true;
  try{const d=await api(path,{method:'POST',body});
    if(d.needs_signup){googleCred=body.credential;$('#gsUser').value=d.suggested_username;$('#loginForm').classList.add('hidden');$('#signupForm').classList.add('hidden');$('#gsForm').classList.remove('hidden');return;}
    token=d.token;me=d.user;localStorage.setItem('lz_token',token);enterApp();
  }catch(e){authErr(e.message);}finally{btn.disabled=false;}
}
$('#loginBtn').onclick=e=>submitAuth(e.target,'/auth/login',{identifier:$('#liId').value,password:$('#liPw').value});
$('#signupBtn').onclick=e=>submitAuth(e.target,'/auth/register',{username:$('#suUser').value.trim(),email:$('#suEmail').value.trim(),password:$('#suPw').value,birth_date:$('#suDob').value});
$('#gsBtn').onclick=e=>submitAuth(e.target,'/auth/google',{credential:googleCred,username:$('#gsUser').value.trim(),birth_date:$('#gsDob').value});
function initGoogle(){
  if(!cfg.googleClientId){$('#googleNote').classList.remove('hidden');return;}
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
  s.onload=()=>{google.accounts.id.initialize({client_id:cfg.googleClientId,callback:r=>submitAuth($('#loginBtn'),'/auth/google',{credential:r.credential})});
    google.accounts.id.renderButton($('#googleBtnBox'),{theme:'filled_black',size:'large',shape:'pill',text:'continue_with',width:260});};
  s.onerror=()=>{$('#googleNote').textContent='تعذّر تحميل Google.';$('#googleNote').classList.remove('hidden');};
  document.head.appendChild(s);
}

/* ---------------- cards / feed ---------------- */
function actionsHtml(p){
  return `${p.avatar_url?`<div class="a" data-act="user" data-u="${esc(p.username)}">${avatarHtml(p,44)}</div>`:''}
  <div class="a" data-act="like"><div class="icon">${p.liked?'❤️':'🤍'}</div><span>${p.likes}</span></div>
  <div class="a" data-act="comments"><div class="icon">💬</div><span>${p.comments}</span></div>
  <div class="a" data-act="share"><div class="icon">↗️</div><span>${p.shares}</span></div>
  <div class="a" data-act="save"><div class="icon">${p.saved?'🔖':'📑'}</div><span>${p.saved?'محفوظ':'حفظ'}</span></div>
  <div class="a" data-act="more"><div class="icon">⋯</div></div>`;
}
function cardHtml(p){
  const media=p.media_type==='video'
    ?`<video class="vmedia" src="${esc(p.media_url)}" loop muted playsinline preload="metadata"></video>`
    :`<img class="vmedia" src="${esc(p.media_url)}" alt="">`;
  return `<div class="vcard" data-id="${p.id}">${media}<div class="vscrim"></div>
  <div class="vinfo"><b data-act="user" data-u="${esc(p.username)}">@${esc(p.username)}</b>${(p.mine||p.following)?'':`<button class="fbtn" data-act="cardfollow" data-u="${esc(p.username)}">+ متابعة</button>`}
  <p>${rich(p.description)}</p></div><div class="vactions">${actionsHtml(p)}</div></div>`;
}
function refreshCard(p){$$('.vcard[data-id="'+p.id+'"]').forEach(c=>{$('.vactions',c).innerHTML=actionsHtml(p);const f=$('.fbtn',c);if(f&&(p.following||p.mine))f.remove();});}
const cardPost=el=>POSTS.get(+el.closest('.vcard').dataset.id);

const io=new IntersectionObserver(es=>es.forEach(en=>{
  const card=en.target,v=$('video',card);
  if(en.isIntersecting&&en.intersectionRatio>=0.7){
    if(v){v.muted=muted;v.play().catch(()=>{muted=true;v.muted=true;v.play().catch(()=>{});});trackVideo(card,v);}
    else if(!card._viewed&&!card._t){card._t=setTimeout(()=>{card._viewed=true;sendView(+card.dataset.id,true);},2000);}
    const kids=feedEl.children;
    if(card===kids[kids.length-1]||card===kids[kids.length-2]){if(!FEED.done)loadFeed();}
  }else{if(v)v.pause();clearTimeout(card._t);card._t=null;}
}),{threshold:[0,0.7,1]});
function sendView(id,completed){api('/posts/'+id+'/view',{method:'POST',body:{completed}}).catch(()=>{});}
function trackVideo(card,v){
  if(v._tracked)return;v._tracked=true;const id=+card.dataset.id;let s1=false,s2=false;
  v.addEventListener('timeupdate',()=>{
    if(!s1&&v.currentTime>=Math.min(2,(v.duration||2)*0.5)){s1=true;sendView(id,false);}
    if(!s2&&v.duration&&v.currentTime>=v.duration-0.35){s2=true;sendView(id,true);}
  });
}
function observeCards(root){$$('.vcard',root).forEach(c=>io.observe(c));}
function toggleMute(){muted=!muted;$$('video.vmedia').forEach(v=>v.muted=muted);toast(muted?'🔇 الصوت مكتوم':'🔊 الصوت يعمل');}

const feedEl=$('#feed');let FEED={items:[],next:null,loading:false,done:false};
async function loadFeed(reset){
  if(FEED.loading)return;
  if(reset){FEED={items:[],next:null,loading:false,done:false};feedEl.innerHTML='<div class="emptyState"><div class="spinner"></div><p>جارٍ التحميل…</p></div>';}
  if(FEED.done)return;
  FEED.loading=true;
  try{
    const d=await api('/feed'+(FEED.next?'?cursor='+FEED.next:''));
    if(!FEED.items.length)feedEl.innerHTML='';
    d.items.forEach(p=>{POSTS.set(p.id,p);FEED.items.push(p);});
    feedEl.insertAdjacentHTML('beforeend',d.items.map(cardHtml).join(''));
    observeCards(feedEl);FEED.next=d.next;FEED.done=!d.next;
    if(!FEED.items.length)feedEl.innerHTML='<div class="emptyState">🎬<b>لا توجد فيديوهات متاحة حتى الآن</b><p>سيظهر هنا ما ينشره الناس. كن أول من ينشر لحظة!</p><button class="btn grad" data-act="create">انشر أول لحظة</button></div>';
  }catch(e){if(!FEED.items.length)feedEl.innerHTML=`<div class="emptyState">⚠️<p>${esc(e.message)}</p><button class="btn ghost" data-act="retry">إعادة المحاولة</button></div>`;else toast(e.message);}
  FEED.loading=false;
}
(function(){ // سحب للأسفل للتحديث
  const ptr=$('#ptr');let y0=null;
  feedEl.addEventListener('touchstart',e=>{y0=feedEl.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  feedEl.addEventListener('touchmove',e=>{if(y0===null)return;const dy=Math.max(0,e.touches[0].clientY-y0);ptr.style.opacity=Math.min(1,dy/80);ptr.style.transform=`translate(-50%,${Math.min(dy,80)/2}px) rotate(${dy*3}deg)`;},{passive:true});
  feedEl.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;ptr.style.opacity=0;if(dy>80)loadFeed(true);},{passive:true});
})();

   ${p.allow_comments?'<div id="commentInput"><input class="field" id="cmInput" maxlength="300" placeholder="أضف تعليقًا..."><button class="btn grad" id="cmSend">إرسال</button></div>':'<p class="muted">التعليقات مغلقة على هذا المنشور</p>'}</div>`);
  const list=$('#cmList',o);

    try{await api('/comments/'+b.dataset.cid,{method:'DELETE'});items=items.filter(c=>c.id!=b.dataset.cid);p.comments=Math.max(0,p.comments-1);refreshCard(p);render();}catch(err){toast(err.message);}};

let STORY_GROUPS=[];
async function loadStories(){try{STORY_GROUPS=await api('/stories');}catch(e){STORY_GROUPS=[];}renderStories();}
function renderStories(){
  $('#storiesRow').innerHTML='<label class="story" for="storyInput"><div class="storyRing addRing">＋</div><div class="storyLabel">قصتي</div></label>'
   +STORY_GROUPS.map((g,i)=>`<div class="story" data-act="story" data-i="${i}"><div class="storyRing ${g.all_seen?'seen':'unseen'}">${avatarHtml(g.user,50)}</div><div class="storyLabel">${g.mine?'قصتك':esc(g.user.username)}</div></div>`).join('');
}
function openStories(gi){
  const g=STORY_GROUPS[gi];let i=Math.max(0,g.stories.findIndex(s=>!s.seen)),timer=null;
  const o=overlay(`<div class="storyView" style="background:#000"><div class="storyProg">${g.stories.map(()=>'<div><i></i></div>').join('')}</div>
    <div class="shead">${avatarHtml(g.user,32)}<b>${esc(g.user.username)}</b><button class="xbtn" data-close>✕</button></div><div class="sbody" style="flex:1;position:relative;margin-top:8px"></div></div>`,true);
  const bars=$$('.storyProg i',o),body=$('.sbody',o);
  const done=()=>{clearInterval(timer);o.remove();loadStories();};
  function show(){
    clearInterval(timer);if(i>=g.stories.length)return done();
    const s=g.stories[i];bars.forEach((b,k)=>b.style.width=k<i?'100%':'0%');
    api('/stories/'+s.id+'/view',{method:'POST'}).catch(()=>{});
    if(s.media_type==='video'){
      body.innerHTML=`<video src="${esc(s.media_url)}" autoplay playsinline style="width:100%;height:100%;object-fit:contain"></video>`;
      const v=body.firstChild;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});
      v.ontimeupdate=()=>{if(v.duration)bars[i].style.width=(v.currentTime/v.duration*100)+'%';};
      v.onended=()=>{i++;show();};
    }else{
      body.innerHTML=`<img src="${esc(s.media_url)}" alt="" style="width:100%;height:100%;object-fit:contain">`;
      let t=0;timer=setInterval(()=>{t+=50;bars[i].style.width=(t/5000*100)+'%';if(t>=5000){i++;show();}},50);
    }
  }
  o.addEventListener('click',e=>{if(e.target.closest('[data-close]'))return done();i++;show();});
  show();
}
$('#storyInput').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>100*1024*1024)return toast('الملف أكبر من 100MB');

  try{await api('/stories',{method:'POST',form:fd});toast('تم نشر قصتك ✅');loadStories();}catch(err){toast(err.message);}
});

let pending=null;
function pick(f){
  if(!f)return;
  if(!/^(image|video)\//.test(f.type))return toast('نوع الملف غير مدعوم');
  if(f.size>100*1024*1024)return toast('الملف أكبر من 100MB');
  pending={file:f,url:URL.createObjectURL(f)};openComposer();
}
['capV','capP','galleryInput'].forEach(id=>$('#'+id).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';pick(f);}));
function openCreate(){
  overlay(`<div class="sheet" style="text-align:center"><div class="sheetHandle"></div><b>منشور جديد</b><br><br>
   <label for="capV" class="btn grad" style="width:100%;display:block;margin-bottom:8px">🎥 تصوير فيديو</label>
   <label for="capP" class="btn ghost" style="width:100%;display:block;margin-bottom:8px">📸 التقاط صورة</label>
   <label for="galleryInput" class="btn ghost" style="width:100%;display:block">🖼️ اختيار من المعرض</label></div>`);
}
function openComposer(){
  closeOverlays();let allow=true;
  const prev=pending.file.type.startsWith('video/')
    ?`<video src="${pending.url}" controls playsinline muted style="width:100%;max-height:260px;border-radius:12px;background:#000"></video>`
    :`<img src="${pending.url}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px">`;
  const o=overlay(`<div class="sheet"><div class="sheetHandle"></div><b>نشر لحظة</b><div style="margin:10px 0">${prev}</div>
   <textarea class="field" id="cDesc" rows="3" maxlength="500" placeholder="اكتب وصفًا... استخدم #هاشتاغ لتنضم لتحدٍّ"></textarea>
   <div class="switchRow">السماح بالتعليقات<div class="toggle on" id="cAllow"><i></i></div></div>
   <div class="bar hidden" id="cBar"><i></i></div>
   <button class="btn grad" style="width:100%;margin-top:8px" id="cPub">نشر</button></div>`);
  $('#cAllow',o).onclick=e=>{allow=!allow;e.currentTarget.classList.toggle('on',allow);};
  $('#cPub',o).onclick=e=>{
    const btn=e.target;btn.disabled=true;$('#cBar',o).classList.remove('hidden');
    const fd=new FormData();fd.append('description',$('#cDesc',o).value);fd.append('allow_comments',allow?'1':'0');fd.append('media',pending.file);
    const x=new XMLHttpRequest();x.open('POST','/api/posts');x.setRequestHeader('Authorization','Bearer '+token);
    x.upload.onprogress=ev=>{if(ev.lengthComputable)$('#cBar i',o).style.width=(ev.loaded/ev.total*100)+'%';};
    x.onload=()=>{let d={};try{d=JSON.parse(x.responseText);}catch(err){}
      if(x.status>=200&&x.status<300){toast('تم النشر ✅');pending=null;closeOverlays();switchView('home');loadFeed(true);}
      else{toast(d.error||'فشل النشر');btn.disabled=false;}};
    x.onerror=()=>{toast('تعذّر الاتصال بالخادم');btn.disabled=false;};
    x.send(fd);
  };
}

$('#sq').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,300);});
$$('.stab').forEach(b=>b.onclick=()=>{$$('.stab').forEach(x=>x.classList.remove('active'));b.classList.add('active');searchType=b.dataset.t;runSearch();});
async function runSearch(){
  const q=$('#sq').value.trim(),box=$('#sres'),my=++searchSeq;
  try{
    if(!q){
      const t=await api('/hashtags/trending');if(my!==searchSeq)return;
      box.innerHTML=t.length?'<h4 class="sect">🏆 التحديات الرائجة هذا الأسبوع</h4>'+t.map(h=>`<div class="switchRow" data-act="tag" data-tag="${esc(h.tag)}" style="cursor:pointer"><b>#${esc(h.tag)}</b><span class="muted">${h.count} منشور</span></div>`).join('')
        :'<div class="emptyState" style="height:auto;padding:40px">🔍<p>ابحث عن أشخاص أو فيديوهات أو هاشتاغات</p></div>';
      return;
    }
    box.innerHTML=spin;
    const r=await api('/search?type='+searchType+'&q='+encodeURIComponent(q));if(my!==searchSeq)return;
    if(!r.length){box.innerHTML='<div class="emptyState" style="height:auto;padding:40px">🤷<p>لا نتائج</p></div>';return;}
    if(searchType==='users')box.innerHTML=r.map(u=>`<div class="urow">${avatarHtml(u,44)}<div class="grow" data-act="user" data-u="${esc(u.username)}"><b style="font-size:13px">${esc(u.display_name)}</b><div class="muted">@${esc(u.username)}</div></div><button class="pbtn ${u.follow?'':'on'}" data-act="sfollow" data-u="${esc(u.username)}" data-f="${u.follow||''}">${{accepted:'متابَع',pending:'تم الطلب'}[u.follow]||'متابعة'}</button></div>`).join('');
    else if(searchType==='hashtags')box.innerHTML=r.map(h=>`<div class="switchRow" data-act="tag" data-tag="${esc(h.tag)}" style="cursor:pointer"><b>#${esc(h.tag)}</b><span class="muted">${h.count} منشور</span></div>`).join('');
    else box.innerHTML=gridOrEmpty(r);
  }catch(e){if(my===searchSeq)box.innerHTML=`<p class="muted" style="padding:20px">${esc(e.message)}</p>`;}
}
function setBadge(n){const b=$('#nbadge');b.textContent=n>99?'99+':n;b.classList.toggle('hidden',!n);}
async function pollBadge(){try{setBadge((await api('/notifications/unread')).count);}catch(e){}}
async function loadNotifs(){
  const box=$('#nlist');box.innerHTML=spin;
  try{
    const [items,reqs]=await Promise.all([api('/notifications'),api('/follow-requests')]);
    box.innerHTML=(reqs.length?`<div class="switchRow" data-act="requests" style="cursor:pointer">👥 طلبات المتابعة <b>${reqs.length}</b></div>`:'')
     +(items.length?items.map(n=>`<div class="urow ${n.is_read?'':'unread'}" style="padding:10px 6px">${avatarHtml(n,40)}<div class="grow" ${n.post_id?`data-act="openpost" data-id="${n.post_id}"`:`data-act="user" data-u="${esc(n.username)}"`}><b style="font-size:13px">${esc(n.display_name)}</b> ${NTXT[n.type]||''}<div class="muted">${ago(n.created_at)}</div></div></div>`).join('')
       :(reqs.length?'':'<div class="emptyState" style="height:auto;padding:60px">🔔<p>لا توجد إشعارات بعد.<br>ستظهر هنا المتابعات والإعجابات والتعليقات الحقيقية.</p></div>'));
    await api('/notifications/read',{method:'POST'});setBadge(0);
  }catch(e){box.innerHTML=`<p class="muted" style="padding:20px">${esc(e.message)}</p>`;}
}

/* ---------------- actions router ---------------- */
const H={
  like:async el=>{const p=cardPost(el);Object.assign(p,await api('/posts/'+p.id+'/like',{method:p.liked?'DELETE':'POST'}));refreshCard(p);},
  save:async el=>{const p=cardPost(el);Object.assign(p,await api('/posts/'+p.id+'/save',{method:p.saved?'DELETE':'POST'}));refreshCard(p);toast(p.saved?'تم الحفظ':'أُزيل من المحفوظات');},
  comments:el=>openComments(cardPost(el).id),
  share:el=>sharePost(cardPost(el)),
  more:el=>openMore(cardPost(el)),
  user:el=>{const o=el.closest('.overlay');if(o&&o.querySelector('.sheet'))o.remove();openProfile(el.dataset.u);},
  tag:el=>openTag(el.dataset.tag),
  openpost:async el=>{openPostView(POSTS.get(+el.dataset.id)||await api('/posts/'+el.dataset.id));},
  cardfollow:async el=>{
    const u=el.dataset.u,r=await api('/users/'+u+'/follow',{method:'POST'});
    POSTS.forEach(q=>{if(q.username===u){if(r.follow==='accepted')q.following=true;refreshCard(q);}});
    if(r.follow==='pending'){el.remove();toast('تم إرسال طلب المتابعة');}else toast('أنت تتابع @'+u);
  },
  sfollow:async el=>{const u=el.dataset.u;const r=await api('/users/'+u+'/follow',{method:el.dataset.f?'DELETE':'POST'});
    el.dataset.f=r.follow||'';el.textContent={accepted:'متابَع',pending:'تم الطلب'}[r.follow]||'متابعة';el.classList.toggle('on',!r.follow);},
  ulist:async el=>{const l=await api('/users/'+el.dataset.u+'/'+el.dataset.kind);openUserList(el.dataset.kind==='followers'?'المتابعون':'المتابَعون',l);},
  ubmore:el=>overlay(`<div class="sheet"><div class="sheetHandle"></div>
    <div class="switchRow" data-act="report" data-type="user" data-id="${el.dataset.id}" style="cursor:pointer">🚩 إبلاغ عن الحساب</div>
    <div class="switchRow" data-act="blockuser" data-u="${esc(el.dataset.u)}" style="cursor:pointer;color:#ff6b6b">🚫 حظر @${esc(el.dataset.u)}</div></div>`),
  report:el=>{el.closest('.overlay').remove();openReport(el.dataset.type,el.dataset.id);},
  dorep:async el=>{await api('/reports',{method:'POST',body:{target_type:el.dataset.type,target_id:+el.dataset.id,reason:el.dataset.reason}});el.closest('.overlay').remove();toast('تم إرسال البلاغ، شكرًا لك');},
  blockuser:async el=>{if(!confirm('حظر @'+el.dataset.u+'؟ لن يرى أي منكما محتوى الآخر.'))return;
    await api('/users/'+el.dataset.u+'/block',{method:'POST'});closeOverlays();toast('تم الحظر');loadFeed(true);loadStories();},
  delpost:async el=>{if(!confirm('حذف المنشور نهائيًا؟'))return;await api('/posts/'+el.dataset.id,{method:'DELETE'});POSTS.delete(+el.dataset.id);closeOverlays();toast('تم الحذف');loadFeed(true);if($('#viewProfile').classList.contains('active'))renderProfile($('#viewProfile'),me.username);},
  story:el=>openStories(+el.dataset.i),
  create:()=>openCreate(),
  retry:()=>loadFeed(true),
  close:el=>el.closest('.overlay').remove(),
  random:async()=>{const p=await api('/random');p?openPostView(p):toast('لا توجد لحظات بعد');},
  editprofile:()=>openEditProfile(),
  settings:()=>openSettings(),
  theme:el=>{const dark=document.documentElement.dataset.theme!=='light';const t=dark?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('lz_theme',t);el.classList.toggle('on',t==='dark');},
  requests:async el=>{
    const l=await api('/follow-requests');
    const o=openUserList('طلبات المتابعة',l,u=>`<button class="pbtn on" data-act="reqok" data-id="${u.id}">قبول</button><button class="pbtn" data-act="reqno" data-id="${u.id}">رفض</button>`);
  },
  reqok:async el=>{await api('/follow-requests/'+el.dataset.id+'/accept',{method:'POST'});el.closest('.urow').remove();toast('تم القبول');},
  reqno:async el=>{await api('/follow-requests/'+el.dataset.id+'/reject',{method:'POST'});el.closest('.urow').remove();},
  blocked:async()=>{const l=await api('/blocks');openUserList('الحسابات المحظورة',l,u=>`<button class="pbtn" data-act="unblock" data-u="${esc(u.username)}">رفع الحظر</button>`);},
  unblock:async el=>{await api('/users/'+el.dataset.u+'/block',{method:'DELETE'});el.closest('.urow').remove();toast('تم رفع الحظر');loadFeed(true);},
  admin:()=>openAdmin(),
  resolve:async el=>{await api('/admin/reports/'+el.dataset.id+'/resolve',{method:'POST',body:{action:el.dataset.action}});toast('تم');const o=el.closest('.overlay');o.remove();openAdmin();},
  logout:()=>{if(confirm('تسجيل الخروج؟'))logoutLocal();}
};
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(el&&H[el.dataset.act]){try{await H[el.dataset.act](el,e);}catch(err){toast(err.message||'حدث خطأ');}return;}
  const c=e.target.closest('.vcard');if(c&&!e.target.closest('.vinfo'))toggleMute();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)$$('video').forEach(v=>v.pause());});

/* ---------------- navigation / boot ---------------- */
function switchView(name){
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view'+name[0].toUpperCase()+name.slice(1)).classList.add('active');
  $$('.navBtn[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===name));
  if(name==='search')runSearch();
  if(name==='notif')loadNotifs();
  if(name==='profile')renderProfile($('#viewProfile'),me.username);
}
$$('.navBtn[data-v]').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
function enterApp(){
  $('#splash').classList.add('hidden');$('#auth').classList.add('hidden');$('#app').style.display='flex';
  switchView('home');loadFeed(true);loadStories();pollBadge();
  const m=location.pathname.match(/^\/p\/(\d+)/);
  if(m)api('/posts/'+m[1]).then(openPostView).catch(e=>toast(e.message));
}
setInterval(()=>{if(token&&me)pollBadge();},60000);
(async function boot(){
  const t0=Date.now();
  try{cfg=await api('/config');}catch(e){}
  if(token){try{me=await api('/me');}catch(e){token=null;}}
  await new Promise(r=>setTimeout(r,Math.max(0,900-(Date.now()-t0))));
  if(token&&me)enterApp();
  else{$('#splash').classList.add('hidden');$('#auth').classList.remove('hidden');initGoogle();}
})();
</script>
